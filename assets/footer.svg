<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00f0ff"/>
      <stop offset="0.7" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#b44dff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="29" width="1000" height="2" fill="url(#n)"/>
  <circle cx="0" cy="30" r="4" fill="#00f0ff">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="52" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#8a99c2">// built with code, coffee &amp; curiosity</text>
</svg>
